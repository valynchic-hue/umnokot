<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>УмнОКот: Музей улик 🧩</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Verdana, Arial, sans-serif; background:linear-gradient(160deg,#1d2440,#3a2c55); min-height:100vh; color:#2b2b3d; display:flex; justify-content:center; padding:16px; }
  #app { width:100%; max-width:680px; }
  .card { background:#fffdf7; border-radius:24px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .header { text-align:center; margin-bottom:18px; }
  .header .cat { font-size:52px; }
  .header h1 { font-size:24px; color:#1d2440; margin-top:6px; }
  .header .sub { font-size:15px; color:#777; margin-top:4px; }
  .case-info { display:flex; justify-content:space-between; align-items:center; background:#eef3ff; border-radius:14px; padding:10px 16px; margin-bottom:14px; font-size:15px; }
  .q-text { font-size:18px; font-weight:bold; margin-bottom:14px; text-align:center; }
  .board { display:flex; gap:14px; align-items:stretch; }
  .col { flex:1; display:flex; flex-direction:column; gap:10px; }
  .slot { background:#fff; border:2px dashed #d5d9ee; border-radius:14px; padding:8px; display:flex; align-items:center; gap:8px; min-height:56px; }
  .slot-text { flex:1; font-size:15px; font-weight:600; }
  .drop { width:110px; min-height:44px; border:2px dashed #b9c0dd; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#aab; transition:.15s; }
  .drop.over { border-color:#16a085; background:#e8f7f4; }
  .chip { background:#16a085; color:#fff; border-radius:10px; padding:12px 14px; font-size:16px; font-weight:bold; text-align:center; cursor:pointer; user-select:none; box-shadow:0 3px 8px rgba(22,160,133,.3); transition:.15s; }
  .chip:hover { transform:translateY(-2px); }
  .chip.sel { outline:3px solid #ffd54f; box-shadow:0 0 0 4px rgba(255,213,79,.4); }
  .chip.ok { background:#3fae5a; cursor:default; }
  .chip.bad { animation:shake .35s; background:#d65b5b; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .status { text-align:center; font-size:14px; color:#888; margin-top:10px; }
  .btn { display:inline-block; padding:13px 26px; font-size:17px; font-weight:bold; border:none; border-radius:14px; cursor:pointer; }
  .btn-main { background:#16a085; color:#fff; }
  .btn-hint { background:#ffe9a8; color:#7a5c00; margin-top:10px; }
  .btn-restart { background:#3fae5a; color:#fff; margin-top:14px; }
  .hint-box, .explain-box { margin-top:14px; padding:12px 16px; border-radius:12px; font-size:15px; line-height:1.5; }
  .hint-box { background:#fff8dd; }
  .explain-box { background:#e8f7ee; }
  .center { text-align:center; }
  .big-stars { font-size:44px; letter-spacing:4px; }
  .progress { height:8px; background:#e4e7f4; border-radius:6px; margin-bottom:16px; overflow:hidden; }
  .progress div { height:100%; background:#16a085; border-radius:6px; transition:.3s; }
  .hidden { display:none; }
  .home-btn { position:fixed; top:18px; left:18px; z-index:999; width:48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg,#7b2fbf,#a450e0); color:#fff; font-size:22px; text-decoration:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(123,47,191,.4); }
  .home-btn:hover { transform:translateY(-3px); }
  @media (max-width:600px) { .board { flex-direction:column; } .drop { width:100%; } }
</style>
</head>
<body>
<a class="home-btn" href="index.html" title="На главную — выбрать другое дело">🏠</a>
<div id="app"><div class="card">
  <div class="header"><div class="cat">🐱🧩</div><h1>УмнОКот: Музей улик 🧩</h1><div class="sub">Дело №6 «Музей улик». ВПР, 4 класс — соединяй улики парами!</div></div>
  <div id="screen-q">
    <div class="progress"><div id="prog-bar" style="width:0%"></div></div>
    <div class="case-info"><span id="q-counter"></span><span id="q-stars"></span></div>
    <div class="q-text" id="q-text"></div>
    <div class="board">
      <div class="col" id="slots"></div>
      <div class="col" id="pool"></div>
    </div>
    <div class="status" id="status"></div>
    <div id="hint-box" class="hint-box hidden"></div>
    <div id="explain-box" class="explain-box hidden"></div>
    <div class="center"><button id="btn-hint" class="btn btn-hint" onclick="showHint()">💡 Подсказка УмнОКота</button><button id="btn-next" class="btn btn-main hidden" onclick="nextQ()">Дальше →</button></div>
  </div>
  <div id="screen-end" class="hidden center">
    <div style="font-size:60px;">🏆</div>
    <div class="big-stars" id="end-stars"></div>
    <p id="end-msg" style="font-size:18px; margin-top:14px;"></p>
    <p style="color:#888; margin-top:8px;" id="end-detail"></p>
    <button class="btn btn-restart" onclick="location.reload()">🔄 Пройти ещё раз</button>
  </div>
</div></div>
<script>
function shuffleArray(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var BANKS = [
  { t:"Соедини каждую величину с её значением:", ex:"1 км = 1000 м, 1 м = 100 см, 1 кг = 1000 г, 1 т = 100 кг.",
    pairs:[["1 км","1000 м"],["1 м","100 см"],["1 кг","1000 г"],["1 т","100 кг"]] },
  { t:"Соедини каждую единицу времени с её значением:", ex:"1 ч = 60 мин, 1 мин = 60 с, 1 сутки = 24 ч, 1 год = 12 месяцев.",
    pairs:[["1 ч","60 мин"],["1 мин","60 с"],["1 сутки","24 ч"],["1 год","12 мес"]] },
  { t:"Соедини величины и их переводы:", ex:"1 дм = 10 см, 1 м = 10 дм, 1 км = 1000 м, 1 ц = 100 кг.",
    pairs:[["1 дм","10 см"],["1 м","10 дм"],["1 км","1000 м"],["1 ц","100 кг"]] },
  { t:"Соедини величины и их значения:", ex:"1 т = 10 ц, 1 век = 100 лет, 1 неделя = 7 суток, 1 см = 10 мм.",
    pairs:[["1 т","10 ц"],["1 век","100 лет"],["1 неделя","7 суток"],["1 см","10 мм"]] },
  { t:"Найди пропущенное число в каждой улике:", ex:"7 × 8 = 56; 28 + 12 = 40; 90 − 45 = 45; 54 : 6 = 9.",
    pairs:[["7 × □ = 56","8"],["□ + 12 = 40","28"],["90 − □ = 45","45"],["□ : 6 = 9","54"]] },
  { t:"Найди пропущенное число в каждой улике:", ex:"6 × 7 = 42; 35 + 15 = 50; 72 : 9 = 8; 46 − 30 = 16.",
    pairs:[["6 × □ = 42","7"],["□ + 15 = 50","35"],["72 : □ = 8","9"],["□ − 30 = 16","46"]] },
  { t:"Найди пропущенное число в каждой улике:", ex:"5 × 9 = 45; 48 : 4 = 12; 53 + 7 = 60; 84 − 70 = 14.",
    pairs:[["5 × □ = 45","9"],["□ : 4 = 12","48"],["□ + 7 = 60","53"],["84 − □ = 14","70"]] },
  { t:"Соедини каждую фигуру с её формулой (a и b — стороны):", ex:"Площадь прямоугольника — a × b, площадь квадрата — a × a, периметр квадрата — 4 × a, периметр прямоугольника — (a + b) × 2.",
    pairs:[["Площадь прямоугольника","a × b"],["Площадь квадрата","a × a"],["Периметр квадрата","4 × a"],["Периметр прямоугольника","(a + b) × 2"]] },
  { t:"Соедини название доли с её записью:", ex:"Половина — 1/2, четверть — 1/4, треть — 1/3, пятая часть — 1/5.",
    pairs:[["Половина","1/2"],["Четверть","1/4"],["Треть","1/3"],["Пятая часть","1/5"]] },
  { t:"Соедини улику с числом, кратным ей:", ex:"45 делится на 5; 49 — на 7; 81 — на 9; 27 — на 3.",
    pairs:[["Кратно числу 5","45"],["Кратно числу 7","49"],["Кратно числу 9","81"],["Кратно числу 3","27"]] }
];

function buildQuiz(){
  return shuffleArray(BANKS).slice(0,6).map(function(b){
    var pairs = shuffleArray(b.pairs);
    return { t:b.t, ex:b.ex, pairs:pairs, chips:shuffleArray(pairs.map(function(p){ return p[1]; })) };
  });
}
const QUESTIONS = buildQuiz();
let idx = 0, score = 0, mistakes = 0, placed = 0, sel = null;

function render() {
  const q = QUESTIONS[idx];
  mistakes = 0; placed = 0; sel = null;
  document.getElementById('prog-bar').style.width = (idx / QUESTIONS.length * 100) + '%';
  document.getElementById('q-counter').textContent = 'Экспозиция ' + (idx + 1) + ' из ' + QUESTIONS.length;
  document.getElementById('q-stars').textContent = '⭐'.repeat(score);
  document.getElementById('q-text').textContent = q.t;
  document.getElementById('status').textContent = 'Выбери улику справа, затем место для неё слева.';
  document.getElementById('hint-box').classList.add('hidden');
  document.getElementById('explain-box').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-hint').classList.remove('hidden');
  const slots = document.getElementById('slots');
  const pool = document.getElementById('pool');
  slots.innerHTML = ''; pool.innerHTML = '';
  q.pairs.forEach(function(p, i) {
    const s = document.createElement('div'); s.className = 'slot';
    const t = document.createElement('div'); t.className = 'slot-text'; t.textContent = p[0];
    const d = document.createElement('div'); d.className = 'drop'; d.dataset.i = i; d.textContent = '?';
    d.addEventListener('click', function(){ attempt(d, null); });
    d.addEventListener('dragover', function(e){ e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
    d.addEventListener('drop', function(e){ e.preventDefault(); d.classList.remove('over'); attempt(d, parseInt(e.dataTransfer.getData('text/plain'))); });
    s.appendChild(t); s.appendChild(d); slots.appendChild(s);
  });
  q.chips.forEach(function(c, j) {
    const ch = document.createElement('div'); ch.className = 'chip'; ch.textContent = c; ch.dataset.c = j; ch.draggable = true;
    ch.addEventListener('click', function(){ selectChip(ch, j); });
    ch.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(j)); });
    pool.appendChild(ch);
  });
}
function selectChip(el, j) {
  if (el.classList.contains('placed')) return;
  document.querySelectorAll('.chip.sel').forEach(function(c){ c.classList.remove('sel'); });
  if (sel === j) { sel = null; return; }
  sel = j; el.classList.add('sel');
  document.getElementById('status').textContent = 'Теперь выбери место слева для «' + el.textContent + '».';
}
function attempt(dropEl, chipIdx) {
  if (placed >= QUESTIONS[idx].pairs.length) return;
  const use = (chipIdx !== null) ? chipIdx : sel;
  if (use === null) return;
  const q = QUESTIONS[idx];
  const chip = document.querySelector('.chip[data-c="' + use + '"]');
  if (chip.classList.contains('placed')) return;
  if (q.pairs[+dropEl.dataset.i][1] === q.chips[use]) {
    dropEl.innerHTML = ''; dropEl.appendChild(chip);
    chip.classList.add('placed','ok'); chip.classList.remove('sel'); chip.draggable = false;
    dropEl.style.borderStyle = 'solid'; dropEl.style.borderColor = '#3fae5a';
    sel = null; placed++;
    document.getElementById('status').textContent = 'Соединено: ' + placed + ' из ' + q.pairs.length;
    if (placed === q.pairs.length) finishRound();
  } else {
    chip.classList.add('bad'); mistakes++;
    setTimeout(function(){ chip.classList.remove('bad'); }, 400);
    sel = null; chip.classList.remove('sel');
    document.getElementById('status').textContent = 'Не та улика! Ошибок: ' + mistakes;
  }
}
function finishRound() {
  const q = QUESTIONS[idx];
  document.getElementById('btn-hint').classList.add('hidden');
  const good = mistakes <= 1;
  if (good) { score++; document.getElementById('q-stars').textContent = '⭐'.repeat(score); }
  const ex = document.getElementById('explain-box');
  ex.textContent = (good ? '✅ Экспозиция раскрыта! ' : '❌ Было больше одной ошибки. ') + q.ex;
  ex.classList.remove('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
}
function showHint() {
  const q = QUESTIONS[idx];
  for (let i = 0; i < q.pairs.length; i++) {
    const drop = document.querySelector('.drop[data-i="' + i + '"]');
    if (drop && drop.textContent === '?') {
      const val = q.pairs[i][1];
      const chips = document.querySelectorAll('.chip:not(.placed)');
      for (const c of chips) {
        if (c.textContent === val) {
          drop.classList.add('over'); c.classList.add('sel');
          setTimeout(function(){ drop.classList.remove('over'); c.classList.remove('sel'); }, 900);
          break;
        }
      }
      const h = document.getElementById('hint-box');
      h.textContent = '🐱 УмнОКот мигает парой: «' + q.pairs[i][0] + '» и «' + val + '».';
      h.classList.remove('hidden');
      document.getElementById('btn-hint').classList.add('hidden');
      return;
    }
  }
}
function nextQ() {
  idx++;
  if (idx < QUESTIONS.length) render();
  else {
    document.getElementById('screen-q').classList.add('hidden');
    document.getElementById('screen-end').classList.remove('hidden');
    document.getElementById('end-stars').textContent = '⭐'.repeat(score) + '☆'.repeat(QUESTIONS.length - score);
    let msg;
    if (score === QUESTIONS.length) msg = 'Весь музей улик раскрыт! Феноменально! 🎉';
    else if (score >= QUESTIONS.length - 2) msg = 'Отличный куратор музея!';
    else msg = 'УмнОКот верит в тебя! Повтори связи и попробуй снова.';
    document.getElementById('end-msg').textContent = msg;
    document.getElementById('end-detail').textContent = 'Результат: ' + score + ' из ' + QUESTIONS.length + ' звёздочек';
  }
}
render();
</script>
</body>
</html>
