<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>УмноКот: Русский язык ✍️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Verdana, Arial, sans-serif; background:linear-gradient(160deg,#1d2440,#3a2c55); min-height:100vh; color:#2b2b3d; display:flex; justify-content:center; padding:16px; }
  #app { width:100%; max-width:640px; }
  .card { background:#fffdf7; border-radius:24px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .header { text-align:center; margin-bottom:18px; }
  .header .cat { font-size:52px; }
  .header h1 { font-size:24px; color:#1d2440; margin-top:6px; }
  .header .sub { font-size:15px; color:#777; margin-top:4px; }
  .case-info { display:flex; justify-content:space-between; align-items:center; background:#eef3ff; border-radius:14px; padding:10px 16px; margin-bottom:16px; font-size:15px; }
  .stars span { font-size:20px; }
  .q-text { font-size:19px; font-weight:bold; line-height:1.45; margin-bottom:14px; }
  .answers button { display:block; width:100%; padding:14px; margin-bottom:10px; font-size:17px; border:2px solid #d5d9ee; border-radius:14px; background:#fff; cursor:pointer; text-align:left; transition:.15s; color:#2b2b3d; }
  .answers button:hover { border-color:#5b6bd6; background:#f4f6ff; }
  .answers button.correct { border-color:#3fae5a; background:#e8f7ee; }
  .answers button.wrong { border-color:#d65b5b; background:#fdecec; }
  .answers button:disabled { cursor:default; }
  .input-row { display:flex; gap:10px; }
  .input-row input { flex:1; padding:13px; font-size:18px; border:2px solid #d5d9ee; border-radius:14px; }
  .btn { display:inline-block; padding:13px 26px; font-size:17px; font-weight:bold; border:none; border-radius:14px; cursor:pointer; }
  .btn-main { background:#5b6bd6; color:#fff; }
  .btn-hint { background:#ffe9a8; color:#7a5c00; margin-top:10px; }
  .btn-restart { background:#3fae5a; color:#fff; margin-top:14px; }
  .hint-box, .explain-box { margin-top:14px; padding:12px 16px; border-radius:12px; font-size:15px; line-height:1.4; }
  .hint-box { background:#fff8dd; }
  .explain-box { background:#e8f7ee; }
  .center { text-align:center; }
  .big-stars { font-size:44px; letter-spacing:4px; }
  .progress { height:8px; background:#e4e7f4; border-radius:6px; margin-bottom:16px; overflow:hidden; }
  .progress div { height:100%; background:#5b6bd6; border-radius:6px; transition:.3s; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app"><div class="card">
  <div class="header"><div class="cat">🐱‍🕵️</div><h1>УмноКот: Русский язык ✍️</h1><div class="sub">Дело №2 «Тайна великого и могучего». ВПР, 4 класс — каждое прохождение с новыми заданиями!</div></div>
  <div id="screen-q">
    <div class="progress"><div id="prog-bar" style="width:0%"></div></div>
    <div class="case-info"><span id="q-counter"></span><span class="stars" id="q-stars"></span></div>
    <div class="q-text" id="q-text"></div>
    <div class="answers" id="answers"></div>
    <div id="input-area" class="hidden"><div class="input-row"><input type="text" id="free-input" autocomplete="off"><button class="btn btn-main" onclick="checkFree()">Ответить</button></div></div>
    <div id="hint-box" class="hint-box hidden"></div>
    <div id="explain-box" class="explain-box hidden"></div>
    <div class="center"><button id="btn-hint" class="btn btn-hint" onclick="showHint()">💡 Подсказка УмноКота</button><button id="btn-next" class="btn btn-main hidden" onclick="nextQ()">Дальше →</button></div>
  </div>
  <div id="screen-end" class="hidden center">
    <div style="font-size:60px;">🏆</div>
    <div class="big-stars" id="end-stars"></div>
    <p id="end-msg" style="font-size:18px; margin-top:14px;"></p>
    <p style="color:#888; margin-top:8px;" id="end-detail"></p>
    <button class="btn btn-restart" onclick="location.reload()">🔄 Пройти ещё раз</button>
  </div>
</div></div>
<script>

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
function shuffleArray(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mk(q, correct, wrongs, hint, ex) {
  var seen = [String(correct)];
  var opts = [String(correct)];
  for (var i = 0; i < wrongs.length && opts.length < 4; i++) {
    var s = String(wrongs[i]);
    if (seen.indexOf(s) === -1) { seen.push(s); opts.push(s); }
  }
  opts = shuffleArray(opts);
  return { q: q, options: opts, a: opts.indexOf(String(correct)), hint: hint, ex: ex };
}

// ===== Банки заданий =====
var vowels = [
  ["в..да","о",["а","е","и"],"вóды","Проверочное слово — «вóды»: под ударением ясно слышится [о]."],
  ["г..ра","о",["а","е","и"],"гóры","Проверочное слово — «гóры»: под ударением ясно слышится [о]."],
  ["гр..чи","о",["а","е","и"],"грáч","Проверочное слово — «грáч»: под ударением ясно слышится [о]."],
  ["м..сты","о",["а","е","и"],"мóст","Проверочное слово — «мóст»: под ударением ясно слышится [о]."],
  ["к..за","о",["а","е","и"],"кóзы","Проверочное слово — «кóзы»: под ударением ясно слышится [о]."],
  ["тр..ва","а",["о","е","и"],"трáвка","Проверочное слово — «трáвка»: под ударением ясно слышится [а]."],
  ["р..ка","е",["а","о","и"],"рéчка","Проверочное слово — «рéчка»: под ударением ясно слышится [е]."],
  ["с..ды","а",["о","е","и"],"сáд","Проверочное слово — «сáд»: под ударением ясно слышится [а]."],
  ["п..сок","о",["а","е","и"],"пéсочный","Проверочное слово — «пéсочный»: под ударением ясно слышится [о]."],
  ["з..ма","и",["а","о","е"],"зúмний","Проверочное слово — «зúмний»: под ударением ясно слышится [и]."],
  ["г..лова","о",["а","е","и"],"гóловка","Проверочное слово — «гóловка»: под ударением ясно слышится [о]."],
  ["сл..ны","о",["а","е","и"],"слóн","Проверочное слово — «слóн»: под ударением ясно слышится [о]."],
  ["л..сток","и",["а","о","е"],"лúст","Проверочное слово — «лúст»: под ударением ясно слышится [и]."],
  ["н..ра","о",["а","е","и"],"нóрка","Проверочное слово — «нóрка»: под ударением ясно слышится [о]."],
  ["д..жди","о",["а","е","и"],"дóждь","Проверочное слово — «дóждь»: под ударением ясно слышится [о]."],
  ["ч..сы","а",["о","е","и"],"чáс","Проверочное слово — «чáс»: под ударением ясно слышится [а]."],
  ["ш..ры","а",["о","е","и"],"шáры","Проверочное слово — «шáры»: под ударением ясно слышится [а]."],
  ["в..лны","о",["а","е","и"],"вóлны","Проверочное слово — «вóлны»: под ударением ясно слышится [о]."]
];
var tsep = [
  ["под..езд","ъ","Под..езд. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["об..ём","ъ","Об..ём. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["раз..езд","ъ","Раз..езд. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["в..ехал","ъ","В..ехал. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["об..явление","ъ","Об..явление. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["под..ём","ъ","Под..ём. Ъ пишется после приставки на согласную перед е, ё, ю, я."],
  ["в..юга","ь","В..юга. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["сем..я","ь","Сем..я. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["лист..я","ь","Лист..я. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["руж..ё","ь","Руж..ё. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["осен..ю","ь","Осен..ю. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["обез..яна","ь","Обез..яна. ь пишется в корне слова после согласной перед е, ё, ю, я."],
  ["брат..я","ь","Брат..я. ь пишется в корне слова после согласной перед е, ё, ю, я."]
];
var tsya = [
  ["Кот умыва(?)ся.","тся","Умывáется — кто? что делает? В вопросе есть «ь»? Нет — значит, пишем без ь."],
  ["Пора отправля(?)ся в путь.","ться","Отправи́ться — что сделать? В вопросе есть ь — пишем с ь."],
  ["Он учит(?)ся в школе.","тся","У́чится — что делает? В вопросе нет ь — пишем без ь."],
  ["Друзья решили встре(?)титься.","ться","Встре́титься — что сделать? В вопросе есть ь — пишем с ь."],
  ["УмноКот собира(?)ся в школу.","тся","Собира́ется — что делает? В вопросе нет ь — пишем без ь."],
  ["Кот решил прогуля(?)ться по саду.","ться","Прогуля́ться — что сделать? В вопросе есть ь — пишем с ь."],
  ["Мне нрав(?)ся этот мультфильм.","тся","Нра́вится — что делает? В вопросе нет ь — пишем без ь."],
  ["Собака бо(?)тся грома.","тся","Бои́тся — что делает? В вопросе нет ь — пишем без ь."]
];
var ruStatic = [
  mk("Подбери синоним к слову «храбрый».","смелый",["трусливый","быстрый","весёлый"],"Синоним — слово с похожим смыслом.","Храбрый = смелый. «Трусливый» — антоним, а «быстрый» и «весёлый» про другое."),
  mk("Найди грамматическую основу предложения: «УмноКот ловко поймал мышку».","УмноКот поймал",["поймал мышку","ловко поймал","УмноКот ловко"],"Грамматическая основа — подлежащее и сказуемое. Кто? Что делал?","Подлежащее — «УмноКот» (кто?), сказуемое — «поймал» (что сделал?)."),
  mk("Сколько звуков и сколько букв в слове «юла»?","4 звука, 3 буквы",["3 звука, 3 буквы","4 звука, 4 буквы","3 звука, 4 буквы"],"Буква «ю» в начале слова обозначает сразу два звука: [йу].","«Юла» — 3 буквы, а звуков 4: [й], [у], [л], [а]."),
  mk("Как правильно перенести слово «огород»?","о-город, ог-ород",["огород","о-г-ород","огоро-д"],"Нельзя оставлять одну букву на строке и отрывать одну согласную от корня.","Правильно: «о-город» или «ог-ород». Вариант «огоро-д» неверен."),
  mk("Сколько букв и звуков в слове «конь»?","4 буквы, 3 звука",["4 буквы, 4 звука","5 букв, 4 звука","3 буквы, 3 звука"],"Мягкий знак звука не обозначает.","«Конь» — 4 буквы, а звуков 3: [к], [н'], [о]. Мягкий знак звука не обозначает, но показывает мягкость [н']."),
  mk("Определи часть речи слова «прыгает».","глагол",["имя существительное","имя прилагательное","наречие"],"Спроси: что делает?","«Прыгает» — глагол: отвечает на вопрос «что делает?» и обозначает действие."),
  mk("Какое слово одушевлённое?","заяц",["ель","гроза","камень"],"Одушевлённые отвечают на вопрос «кто?».","«Заяц» — одушевлённое: это живое существо, отвечаем на вопрос «кто?»."),
  mk("Подбери антоним к слову «север».","юг",["запад","восток","полярье"],"Антоним — слово с противоположным смыслом.","Север — юг: противоположные стороны горизонта."),
  mk("Какое слово — проверочное к слову «столб»?","столбы",["стол","стул","столешница"],"Измени слово так, чтобы согласная оказалась перед гласной.","Проверочное слово — «столбы»: перед гласной [б] звучит ясно."),
  mk("Определи падеж существительного: «заглянул в окно».","винительный падеж",["родительный падеж","дательный падеж","предложный падеж"],"Задай вопрос от глагола: заглянул (во что? куда?).","Заглянул (во что?) в окно — винительный падеж."),
  mk("Сколько слогов в слове «якорь»?","2",["3","1","4"],"В слове столько слогов, сколько гласных.","«Якорь» — два гласных звука, значит два слога: я-корь."),
  mk("Найди однокоренное слово к слову «лесной».","лесник",["лесенка","листопад","лодка"],"Ищи общий корень со значением «лес».","Корень «-лес-»: лесной — лесник. «Лесенка» и «листопад» — другие корни.")
];

function buildQuiz() {
  var q = [];
  shuffleArray(vowels).slice(0, 4).forEach(function(v) {
    q.push(mk("УмноКот нашёл слово с пропущенной буквой: «" + v[0] + "». Какую букву нужно вставить?", v[1], v[2],
      "Подбери проверочное слово: поставь гласную под ударение.", v[4]));
  });
  shuffleArray(tsep).slice(0, 3).forEach(function(t) {
    q.push(mk("Вставь пропущенную букву: «" + t[0] + "».", t[1], ["ъ", "ь", "знак не нужен"],
      "Ъ — после приставки на согласную. ь — в корне слова.", t[2]));
  });
  shuffleArray(tsya).slice(0, 2).forEach(function(t) {
    q.push(mk(t[0], t[1], ["ться", "обе верны"],
      "Задай вопрос: «что делает?» или «что сделать?».", t[2]));
  });
  shuffleArray(ruStatic).slice(0, 3).forEach(function(s) { q.push(s); });
  return shuffleArray(q);
}
const QUESTIONS = buildQuiz();

let idx = 0, score = 0, usedHint = [], locked = false;

function render() {
  locked = false;
  const q = QUESTIONS[idx];
  document.getElementById('prog-bar').style.width = (idx / QUESTIONS.length * 100) + '%';
  document.getElementById('q-counter').textContent = 'Задание ' + (idx + 1) + ' из ' + QUESTIONS.length;
  document.getElementById('q-stars').textContent = '⭐'.repeat(score);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('hint-box').classList.add('hidden');
  document.getElementById('explain-box').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-hint').classList.remove('hidden');
  const ans = document.getElementById('answers');
  const inp = document.getElementById('input-area');
  ans.innerHTML = ''; ans.classList.add('hidden'); inp.classList.add('hidden');
  if (q.options) {
    ans.classList.remove('hidden');
    q.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => check(i, b);
      ans.appendChild(b);
    });
  } else {
    inp.classList.remove('hidden');
    document.getElementById('free-input').value = '';
    setTimeout(() => document.getElementById('free-input').focus(), 50);
  }
}
function normalize(s) { return s.toString().trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' '); }
function check(i, btn) {
  if (locked) return; locked = true;
  const q = QUESTIONS[idx];
  const buttons = document.querySelectorAll('#answers button');
  buttons.forEach((b, j) => { b.disabled = true; if (j === q.a) b.classList.add('correct'); });
  if (i === q.a) { score++; document.getElementById('q-stars').textContent = '⭐'.repeat(score); }
  else btn.classList.add('wrong');
  finish(i === q.a);
}
function checkFree() {
  if (locked) return; locked = true;
  const q = QUESTIONS[idx];
  const val = document.getElementById('free-input').value;
  const ok = Array.isArray(q.a) ? q.a.map(normalize).includes(normalize(val)) : normalize(val) === normalize(q.a);
  const inp = document.getElementById('free-input');
  inp.style.borderColor = ok ? '#3fae5a' : '#d65b5b';
  if (ok) { score++; document.getElementById('q-stars').textContent = '⭐'.repeat(score); }
  if (!ok && q.correctText) {
    const d = document.createElement('div'); d.style.marginTop='8px'; d.textContent = 'Правильный ответ: ' + q.correctText;
    document.getElementById('answers').appendChild(d);
  }
  finish(ok);
}
function finish(ok) {
  const q = QUESTIONS[idx];
  document.getElementById('btn-hint').classList.add('hidden');
  const ex = document.getElementById('explain-box');
  ex.textContent = (ok ? '✅ Верно! ' : '❌ Не верно. ') + (q.ex || '');
  ex.classList.remove('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
}
function showHint() {
  const q = QUESTIONS[idx];
  const h = document.getElementById('hint-box');
  h.textContent = '🐱 УмноКот шепчет: ' + q.hint;
  h.classList.remove('hidden');
  document.getElementById('btn-hint').classList.add('hidden');
  usedHint[idx] = true;
}
function nextQ() {
  idx++;
  if (idx < QUESTIONS.length) render();
  else {
    document.getElementById('screen-q').classList.add('hidden');
    document.getElementById('screen-end').classList.remove('hidden');
    document.getElementById('end-stars').textContent = '⭐'.repeat(score) + '☆'.repeat(QUESTIONS.length - score);
    let msg;
    if (score === QUESTIONS.length) msg = 'Феноменально! Все звёзды твои! 🎉';
    else if (score >= QUESTIONS.length - 2) msg = 'Отличный сыщик! ВПР тебе по плечу!';
    else if (score >= QUESTIONS.length / 2) msg = 'Хорошее начало! Прорешай ещё раз — и будет блеск!';
    else msg = 'УмноКот верит в тебя! Загляни в объяснения и попробуй снова.';
    document.getElementById('end-msg').textContent = msg;
    document.getElementById('end-detail').textContent = 'Результат: ' + score + ' из ' + QUESTIONS.length + ' звёздочек';
  }
}
render();
</script>
</body>
</html>
